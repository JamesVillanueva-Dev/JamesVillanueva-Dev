Welcome · SVG
<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root {
      --welcome-color: #000000;
    }
 
    @media (prefers-color-scheme: dark) {
      :root {
        --welcome-color: #ffffff;
      }
    }
 
    .welcome-text {
      font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
      font-size: 56px;
      font-weight: 700;
      stroke: var(--welcome-color);
      stroke-width: 2;
      stroke-dasharray: 1400;
      animation: welcome-cycle 6s ease-in-out infinite;
    }
 
    @keyframes welcome-cycle {
      0%   { opacity: 0; fill: none; stroke-dashoffset: 1400; }
      8%   { opacity: 1; fill: none; stroke-dashoffset: 1400; }
      45%  { opacity: 1; fill: none; stroke-dashoffset: 0; }
      60%  { opacity: 1; fill: var(--welcome-color); stroke-dashoffset: 0; }
      85%  { opacity: 1; fill: var(--welcome-color); stroke-dashoffset: 0; }
      100% { opacity: 0; fill: var(--welcome-color); stroke-dashoffset: 0; }
    }
  </style>
 
  <text x="50%" y="50%" text-anchor="middle" dominant-baseline="middle" class="welcome-text">
    Welcome to my page
  </text>
</svg>
