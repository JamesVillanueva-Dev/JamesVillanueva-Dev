<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root {
      --welcome-color: #000000;
    }
 
    @media (prefers-color-scheme: dark) {
      :root {
        --welcome-color: #ffffff;
      }
    }
 
    .welcome-text {
      font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
      font-size: 56px;
      font-weight: 700;
      fill: none;
      stroke: var(--welcome-color);
      stroke-width: 2;
      stroke-dasharray: 1400;
      stroke-dashoffset: 1400;
      animation:
        draw 3s ease forwards,
        glow 6s ease-in-out infinite 3s;
    }
 
    @keyframes draw {
      to { stroke-dashoffset: 0; }
    }
 
    @keyframes glow {
      0%, 80%, 100% {
        filter: drop-shadow(0 0 0px var(--welcome-color));
      }
      90% {
        filter:
          drop-shadow(0 0 6px var(--welcome-color))
          drop-shadow(0 0 14px var(--welcome-color));
      }
    }
  </style>
 
  <text x="50%" y="50%" text-anchor="middle" dominant-baseline="middle" class="welcome-text">
    Welcome to my page
  </text>
</svg>
 
