<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <style>
    .welcome-text {
      font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
      font-size: 56px;
      font-weight: 700;
      fill: none;
      stroke: #000000;
      stroke-width: 2;
      stroke-dasharray: 1400;
      stroke-dashoffset: 1400;
      animation: draw 3s ease forwards, fill-in 1s ease forwards 3s;
    }
 
    @keyframes draw {
      to {
        stroke-dashoffset: 0;
      }
    }
 
    @keyframes fill-in {
      to {
        fill: #000000;
      }
    }
 
    @media (prefers-color-scheme: dark) {
      .welcome-text {
        stroke: #ffffff;
      }
      @keyframes fill-in {
        to {
          fill: #ffffff;
        }
      }
    }
  </style>
 
  <text x="50%" y="50%" text-anchor="middle" dominant-baseline="middle" class="welcome-text">
    Welcome to my page
  </text>
</svg>
 
